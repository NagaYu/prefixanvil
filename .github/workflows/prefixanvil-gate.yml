name: prefixanvil-gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"          # tests and gate never touch the network (fixture tokenizer is committed)
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Tests
        run: pytest -q
      - name: Generate demo trace
        run: prefixanvil gen --config fixtures/configs/demo.json --out out/ci/demo.jsonl
      - name: Regression gate
        run: prefixanvil gate --trace out/ci/demo.jsonl --baseline fixtures/gate/demo-baseline.json --max-hitrate-drop 0.01 --max-prefill-growth 0.02
