[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prefixanvil"
version = "0.2.0"
description = "Offline analyzer for KV/prefix-cache fragmentation in agent LLM traffic (Phase 2: analyzer, proxy, equivalence gate, CI gate)"
requires-python = ">=3.11"
dependencies = ["transformers>=4.45", "jinja2>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
prefixanvil = "prefixanvil.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["prefixanvil*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
